<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PALMO CHICKEN</title>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
width:100%;
height:100%;
background:#050505;
color:#fff;
font-family:Arial,Helvetica,sans-serif;
overflow:hidden;
}

#display{
position:relative;
width:100vw;
height:100vh;
overflow:hidden;
background:
linear-gradient(45deg,#111 25%,transparent 25%) 0 0/46px 46px,
linear-gradient(45deg,transparent 75%,#111 75%) 0 0/46px 46px,
linear-gradient(45deg,transparent 75%,#111 75%) 23px -23px/46px 46px,
linear-gradient(45deg,#111 25%,#060606 25%,#060606 75%,#111 75%) 23px 23px/46px 46px;
}

/* ===== FOOD ===== */

.food{
position:absolute;
top:0;
bottom:0;
width:21vw;
z-index:1;
background-repeat:no-repeat;
background-position:center;
background-size:cover;
}

.burger{
left:0;
background-image:
linear-gradient(to right,rgba(0,0,0,0) 55%,#050505 100%),
url("https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=1000&q=90");
}

.chicken{
right:0;
background-image:
linear-gradient(to left,rgba(0,0,0,0) 55%,#050505 100%),
url("https://images.unsplash.com/photo-1598103442097-8b74394b95c6?auto=format&fit=crop&w=1000&q=90");
}

/* ===== TOP ===== */

.top{
position:relative;
z-index:5;
height:19vh;
display:flex;
align-items:center;
justify-content:center;
}

.logo{
text-align:center;
position:relative;
}

.logo-title{
display:flex;
align-items:center;
justify-content:center;
gap:7px;
font-family:Arial Black,Impact,Arial;
font-size:4.2vw;
font-weight:900;
letter-spacing:-2px;
line-height:1;
}

.palmo{color:white}
.chicken-text{color:#ed211a}

.flame{
margin-left:5px;
width:64px;
height:70px;
background:#e31d1a;
clip-path:polygon(
50% 0,
64% 21%,
83% 40%,
94% 64%,
80% 87%,
50% 100%,
20% 87%,
6% 64%,
17% 40%,
35% 21%
);
display:flex;
align-items:center;
justify-content:center;
font-family:Arial Black,Arial;
font-size:14px;
font-weight:900;
transform:rotate(-5deg);
}

.subtitle{
display:flex;
align-items:center;
justify-content:center;
gap:9px;
font-size:15px;
font-weight:bold;
margin-top:3px;
}

.line{
height:2px;
width:95px;
background:#c71c18;
}

/* ===== PANELS ===== */

.center{
position:relative;
z-index:5;
width:67vw;
height:76vh;
margin:auto;
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.panel{
height:100%;
background:rgba(6,6,6,.94);
border:1px solid #c31c17;
border-radius:7px;
overflow:hidden;
display:flex;
flex-direction:column;
box-shadow:0 0 5px rgba(255,0,0,.06);
}

.panel-title{
height:65px;
min-height:65px;
background:linear-gradient(#bc100c,#790805);
border-bottom:1px solid #bd1813;
display:flex;
align-items:center;
justify-content:center;
gap:14px;
font-family:Arial Black,Impact,Arial;
font-size:26px;
font-weight:900;
}

.icon{
font-size:29px;
}

/* ===== NUMBERS ===== */

.orders{
flex:1;
padding:11px;
display:grid;
grid-template-columns:repeat(4,1fr);
grid-auto-rows:82px;
gap:9px;
align-content:start;
}

.number{
display:flex;
align-items:center;
justify-content:center;
background:linear-gradient(145deg,#292929,#111);
border:1px solid #333;
border-radius:4px;
font-family:Arial Black,Impact,Arial;
font-size:30px;
font-weight:900;
}

/* NEW READY = GREEN */

.ready .number.new-ready{
background:linear-gradient(145deg,#20d8ad,#067b65);
border:1px solid #58ffda;
box-shadow:
0 0 9px #37f5d0,
0 0 18px rgba(55,245,208,.65);
animation:readyflash .58s ease-in-out 9;
}

@keyframes readyflash{
0%,100%{transform:scale(1)}
50%{transform:scale(1.07);filter:brightness(1.4)}
}

/* ===== FOOTER ===== */

.footer{
height:40px;
min-height:40px;
display:flex;
align-items:center;
justify-content:center;
gap:8px;
font-size:11px;
font-weight:bold;
white-space:nowrap;
}

.footer:before,
.footer:after{
content:"";
height:1px;
width:40px;
background:#d11b16;
}

/* ===== SOUND ===== */

#soundBtn{
position:absolute;
right:15px;
top:15px;
z-index:50;
background:white;
color:#111;
border:0;
border-radius:8px;
padding:9px 12px;
font-weight:bold;
}

/* ===== CONTROL ===== */

#control{
min-height:100vh;
background:#111;
padding:20px;
overflow:auto;
}

.controls{
max-width:800px;
margin:auto;
}

.card{
background:#1c1c1c;
padding:18px;
border-radius:15px;
margin-bottom:15px;
}

.card h2{margin-top:0}

input{
font-size:27px;
padding:12px;
width:65%;
border:0;
border-radius:8px;
}

button{
font-size:18px;
padding:12px;
border:0;
border-radius:9px;
margin:4px;
}

.add{
background:white;
color:#111;
}

.readybtn{
background:#168a58;
color:white;
}

.done{
background:#555;
color:white;
}

.row{
background:#252525;
padding:12px;
margin:8px 0;
border-radius:9px;
}

/* ===== TV ===== */

@media(max-width:1200px){

.center{
width:68vw;
}

.panel-title{
font-size:21px;
height:57px;
min-height:57px;
}

.orders{
grid-auto-rows:70px;
gap:7px;
}

.number{
font-size:25px;
}

.flame{
width:55px;
height:60px;
font-size:11px;
}

}
</style>
</head>

<body>

<div id="display" style="display:none">

<div class="food burger"></div>
<div class="food chicken"></div>

<button id="soundBtn" onclick="enableSound()">
🔊 Ton aktivieren
</button>

<div class="top">

<div class="logo">

<div class="logo-title">

<span class="palmo">PALMO</span>

<span class="chicken-text">CHICKEN</span>

<span class="flame">PALMO</span>

</div>

<div class="subtitle">

<span class="line"></span>

<span>By Palmengrill</span>

<span class="line"></span>

</div>

</div>

</div>


<div class="center">

<!-- PREPARING -->

<div class="panel prep">

<div class="panel-title">
<span class="icon">♨</span>
<span>IN ZUBEREITUNG</span>
</div>

<div id="prep" class="orders"></div>

<div class="footer">
VIELEN DANK, DASS DU HIER BIST!
</div>

</div>


<!-- READY -->

<div class="panel ready">

<div class="panel-title">
<span class="icon">▣</span>
<span>ABHOLBEREIT</span>
</div>

<div id="ready" class="orders"></div>

<div class="footer">
GUTEN APPETIT
</div>

</div>

</div>

</div>


<!-- CONTROL -->

<div id="control" style="display:none">

<div class="controls">

<div class="card">

<h2>Neue Bestellnummer</h2>

<input
id="n"
inputmode="numeric"
placeholder="z.B. 125">

<button
class="add"
onclick="addOrder()">
Hinzufügen
</button>

</div>

<div class="card">

<h2>Aktuelle Bestellungen</h2>

<div id="list"></div>

</div>

</div>

</div>


<script>

/* ===== FIREBASE ===== */

var DB =
"https://palmen-grill-monitor-default-rtdb.europe-west1.firebasedatabase.app";


function getParameter(name){

var q =
window.location.search.substring(1).split("&");

for(var i=0;i<q.length;i++){

var p=q[i].split("=");

if(p[0]===name)
return decodeURIComponent(p[1]||"");

}

return null;
}


/* TV DEFAULT */

var mode =
getParameter("mode") || "display";


document.getElementById(
mode==="control" ? "control" : "display"
).style.display="block";


/* ===== SOUND ===== */

var soundEnabled=false;
var previousReady={};
var firstLoad=true;
var audioPlayer=null;
var flashUntil={};


function enableSound(){

soundEnabled=true;

document.getElementById("soundBtn").innerHTML=
"🔊 Ton aktiv";

beep();

setTimeout(function(){
speak("Ton ist aktiviert");
},500);

}


function speak(text){

if(!soundEnabled)return;

try{

var url=
"https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=de&q="
+encodeURIComponent(text);

audioPlayer=new Audio(url);

audioPlayer.volume=1;

var p=audioPlayer.play();

if(p&&p.catch){
p.catch(function(){beep();});
}

audioPlayer.onerror=function(){
beep();
};

}catch(e){
beep();
}

}


function beep(){

try{

var AC=
window.AudioContext||
window.webkitAudioContext;

if(!AC)return;

var ctx=new AC();

var osc=ctx.createOscillator();

var gain=ctx.createGain();

osc.connect(gain);
gain.connect(ctx.destination);

osc.frequency.value=880;
gain.gain.value=.5;

osc.start();

setTimeout(function(){

try{
osc.stop();
ctx.close();
}catch(e){}

},500);

}catch(e){}

}


/* ===== FIREBASE REQUEST ===== */

function req(method,path,data,cb){

var x=new XMLHttpRequest();

x.open(
method,
DB+path+".json",
true
);

x.setRequestHeader(
"Content-Type",
"application/json"
);

x.onreadystatechange=function(){

if(x.readyState===4&&cb){

var r=null;

try{
r=JSON.parse(x.responseText);
}catch(e){}

cb(r);

}

};

x.send(
data===null||data===undefined
?null
:JSON.stringify(data)
);

}


/* ===== ADD ===== */

function addOrder(){

var input=
document.getElementById("n");

var n=
input.value.replace(/\D/g,"");

if(!n)return;

req(
"GET",
"/orders",
null,
function(data){

data=data||{};

var duplicate=false;

Object.keys(data).forEach(function(k){

if(
String(data[k].number)===
String(n)
){
duplicate=true;
}

});

if(duplicate){

alert(
"Nummer "+n+
" ist bereits vorhanden."
);

return;

}

req(
"POST",
"/orders",
{
number:n,
status:"preparing",
createdAt:Date.now()
},
function(){
input.value="";
}
);

}
);

}


/* ===== READY ===== */

function setReady(k){

req(
"PATCH",
"/orders/"+k,
{
status:"ready",
readyAt:Date.now()
}
);

}


/* ===== REMOVE ===== */

function removeOrder(k){

req(
"DELETE",
"/orders/"+k
);

}


/* ===== RENDER ===== */

function render(data){

data=data||{};

var prep="";
var ready="";
var list="";

var currentReady={};

var now=Date.now();

var keys=Object.keys(data);

keys.sort(function(a,b){

return
(data[a].createdAt||0)
-
(data[b].createdAt||0);

});


keys.forEach(function(k){

var o=data[k];

var number=String(o.number);


if(o.status==="ready"){

currentReady[k]=true;


/* NEW READY */

if(
mode==="display" &&
!firstLoad &&
!previousReady[k]
){

flashUntil[k]=now+5200;

speak(
"Nummer "+number+", bitte!"
);

}


var flash=
flashUntil[k] &&
flashUntil[k]>now;


ready+=
'<div class="number'+
(flash?' new-ready':'')+
'">'+
number+
'</div>';


list+=
'<div class="row"><b>'+
number+
'</b> ABHOLBEREIT '+
'<button class="done" onclick="removeOrder(\''+
k+
'\')">Abgeholt</button></div>';

}

else{

prep+=
'<div class="number">'+
number+
'</div>';


list+=
'<div class="row"><b>'+
number+
'</b> IN ZUBEREITUNG '+
'<button class="readybtn" onclick="setReady(\''+
k+
'\')">Fertig</button></div>';

}

});


previousReady=currentReady;

firstLoad=false;


if(mode==="display"){

document.getElementById("prep").innerHTML=prep;

document.getElementById("ready").innerHTML=ready;

}

else{

document.getElementById("list").innerHTML=
list||"Keine Bestellungen";

}

}


/* ===== LIVE UPDATE ===== */

function poll(){

req(
"GET",
"/orders",
null,
function(d){

render(d);

setTimeout(poll,1000);

}
);

}

poll();

</script>

</body>
</html>
