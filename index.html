<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PALMO CHICKEN</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#050505;
  color:#fff;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  overflow:hidden;
}

/* =========================
   TV DISPLAY
========================= */

#display{
  width:100vw;
  height:100vh;
  position:relative;
  overflow:hidden;

  background:
    radial-gradient(circle at 8% 50%,rgba(190,20,15,.10),transparent 25%),
    radial-gradient(circle at 92% 50%,rgba(190,20,15,.10),transparent 25%),
    linear-gradient(45deg,#101010 25%,transparent 25%) 0 0/52px 52px,
    linear-gradient(45deg,transparent 75%,#101010 75%) 0 0/52px 52px,
    linear-gradient(45deg,transparent 75%,#101010 75%) 26px -26px/52px 52px,
    linear-gradient(
      45deg,
      #101010 25%,
      #080808 25%,
      #080808 75%,
      #101010 75%,
      #101010
    ) 26px 26px/52px 52px;
}

/* =========================
   DECORATION - NO IMAGES
========================= */

.left-decoration,
.right-decoration{
  position:absolute;
  top:22%;
  bottom:8%;
  width:14vw;
  z-index:1;
  opacity:.55;
  pointer-events:none;
}

.left-decoration{
  left:0;
  background:
    radial-gradient(circle at 25% 30%,rgba(235,40,28,.25),transparent 12%),
    radial-gradient(circle at 5% 55%,rgba(235,40,28,.18),transparent 20%);
}

.right-decoration{
  right:0;
  background:
    radial-gradient(circle at 75% 35%,rgba(235,40,28,.25),transparent 12%),
    radial-gradient(circle at 95% 60%,rgba(235,40,28,.18),transparent 20%);
}

/* =========================
   HEADER / LOGO
========================= */

.topbar{
  position:relative;
  z-index:5;
  height:20vh;
  min-height:125px;

  display:flex;
  align-items:center;
  justify-content:center;

  padding-top:8px;
}

.brand{
  position:relative;
  text-align:center;
}

.brand-main{
  display:flex;
  justify-content:center;
  align-items:center;

  gap:11px;

  font-family:"Arial Black",Impact,Arial,sans-serif;

  font-size:58px;
  font-weight:900;

  letter-spacing:-2px;
  line-height:.95;

  text-shadow:0 4px 8px #000;

  white-space:nowrap;
}

.palmo{
  color:#fff;
}

.chicken-word{
  color:#ed261d;
}

/* CSS PALMO FLAME LOGO */

.css-logo{
  position:relative;

  width:56px;
  height:66px;

  margin-left:5px;

  display:flex;
  align-items:flex-end;
  justify-content:center;
}

.flame-main{
  position:absolute;

  width:38px;
  height:51px;

  bottom:3px;

  background:
    linear-gradient(
      145deg,
      #ff3428,
      #b80c08
    );

  border-radius:
    70% 25% 65% 40%;

  transform:
    rotate(45deg);

  box-shadow:
    0 0 10px rgba(255,30,20,.28);
}

.flame-inner{
  position:absolute;

  width:18px;
  height:29px;

  bottom:5px;

  background:#050505;

  border-radius:
    70% 30% 60% 45%;

  transform:
    rotate(43deg);
}

.flame-tip{
  position:absolute;

  width:18px;
  height:30px;

  top:3px;
  left:10px;

  background:#e61c14;

  border-radius:
    80% 20% 70% 30%;

  transform:
    rotate(20deg);
}

.brand-sub-row{
  margin-top:8px;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:10px;
}

.brand-line{
  width:110px;
  height:1px;

  background:#c91f18;
}

.brand-sub{
  font-size:18px;
  font-weight:700;

  color:#fff;
}

/* =========================
   SOUND BUTTON
========================= */

.soundbtn{
  position:absolute;

  right:18px;
  top:18px;

  z-index:20;

  background:#fff;
  color:#111;

  font-size:15px;
  font-weight:700;

  border:0;
  border-radius:9px;

  padding:10px 14px;

  cursor:pointer;
}

/* =========================
   CENTER PANELS
========================= */

.screen-center{
  position:relative;
  z-index:5;

  width:70vw;
  height:76vh;

  margin:0 auto;

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:12px;

  padding-bottom:16px;
}

.panel{
  min-width:0;
  height:100%;

  background:
    rgba(8,8,8,.94);

  /* RED BORDER 1PX */
  border:
    1px solid #c51b16;

  border-radius:9px;

  display:flex;
  flex-direction:column;

  overflow:hidden;

  /* LOW RED GLOW */
  box-shadow:
    0 0 6px rgba(255,0,0,.06);
}

.panel-title{
  height:66px;
  min-height:66px;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:13px;

  padding:0 12px;

  background:
    linear-gradient(
      180deg,
      #b30d09,
      #790806
    );

  border-bottom:
    1px solid #d6241c;

  font-family:
    "Arial Black",
    Impact,
    Arial,
    sans-serif;

  font-size:27px;
  font-weight:900;

  letter-spacing:-.5px;

  white-space:nowrap;
}

/* PREPARING ICON */

.prep-icon{
  position:relative;

  width:32px;
  height:32px;

  border:
    3px solid #fff;

  border-top:
    3px solid transparent;

  border-radius:50%;
}

.prep-icon:after{
  content:"";

  position:absolute;

  right:-3px;
  top:-4px;

  width:8px;
  height:8px;

  border-top:
    3px solid #fff;

  border-right:
    3px solid #fff;

  transform:
    rotate(20deg);
}

/* READY ICON */

.ready-icon{
  width:32px;
  height:32px;

  border:
    2px solid #fff;

  border-radius:4px;

  position:relative;
}

.ready-icon:before{
  content:"✓";

  position:absolute;

  left:5px;
  top:-3px;

  font-size:28px;
  font-weight:900;

  color:#fff;
}

/* =========================
   NUMBERS
========================= */

.orders{
  flex:1;

  padding:
    14px 14px 10px;

  display:grid;

  grid-template-columns:
    repeat(4,minmax(0,1fr));

  grid-auto-rows:
    minmax(72px,92px);

  align-content:start;

  gap:10px;
}

.order-num{
  position:relative;

  display:flex;
  align-items:center;
  justify-content:center;

  min-width:0;

  border-radius:5px;

  background:
    linear-gradient(
      145deg,
      #262626,
      #111
    );

  border:
    1px solid #343434;

  font-family:
    "Arial Black",
    Impact,
    Arial,
    sans-serif;

  font-size:31px;
  font-weight:900;

  color:#fff;

  box-shadow:
    inset 0 0 8px rgba(255,255,255,.02),
    0 3px 7px rgba(0,0,0,.35);
}

.ready .order-num{
  background:
    linear-gradient(
      145deg,
      #242424,
      #101010
    );

  border:
    1px solid #343434;
}

/* =========================
   GREEN READY FLASH
========================= */

.ready .order-num.new-ready{

  background:
    linear-gradient(
      145deg,
      #20d8ad,
      #067b65
    ) !important;

  border:
    1px solid #57ffda !important;

  color:#fff;

  box-shadow:
    0 0 8px #37f5d0,
    0 0 20px rgba(31,230,186,.8),
    inset 0 0 12px rgba(255,255,255,.12)
    !important;

  animation:
    greenFlash .58s ease-in-out 9;
}

@keyframes greenFlash{

  0%,100%{
    transform:scale(1);
    filter:brightness(1);
  }

  50%{
    transform:scale(1.07);
    filter:brightness(1.35);
  }

}

.ready .order-num.new-ready::before,
.ready .order-num.new-ready::after{

  content:"";

  position:absolute;

  width:10px;
  height:2px;

  top:50%;

  background:#58ffda;

  box-shadow:
    0 -13px 0 #58ffda,
    0 13px 0 #58ffda;
}

.ready .order-num.new-ready::before{
  left:-13px;
}

.ready .order-num.new-ready::after{
  right:-13px;
}

/* =========================
   FOOTER
========================= */

.panel-footer{
  height:42px;
  min-height:42px;

  display:flex;
  align-items:center;
  justify-content:center;

  gap:9px;

  padding:0 10px;

  font-size:13px;
  font-weight:900;

  white-space:nowrap;
}

.panel-footer::before,
.panel-footer::after{

  content:"";

  height:1px;

  background:#c91f18;

  flex:1;

  max-width:42px;
}

/* =========================
   CONTROL PANEL
========================= */

#control{
  min-height:100vh;

  overflow:auto;

  background:#111;

  padding:18px;
}

.controls{
  max-width:820px;

  margin:auto;
}

.control-logo{
  text-align:center;

  margin-bottom:18px;

  font-family:
    "Arial Black",
    Impact,
    Arial,
    sans-serif;

  font-size:35px;
}

.control-logo span{
  color:#e3261c;
}

.card{
  background:#1c1c1c;

  padding:18px;

  border:
    1px solid #333;

  border-radius:16px;

  margin-bottom:14px;
}

.card h2{
  margin:0 0 15px;
}

input{
  width:64%;

  min-width:180px;

  font-size:28px;

  padding:13px;

  border:0;

  border-radius:9px;
}

button{
  font-size:18px;

  padding:12px 14px;

  border:0;

  border-radius:10px;

  margin:4px;

  cursor:pointer;
}

.add{
  background:#fff;
  color:#111;
}

.readybtn{
  background:#079a73;
  color:#fff;
}

.done{
  background:#555;
  color:#fff;
}

.row{
  padding:13px;

  background:#282828;

  margin:8px 0;

  border-radius:10px;

  font-size:19px;

  display:flex;
  align-items:center;
  gap:8px;

  flex-wrap:wrap;
}

.row b{
  font-size:24px;
}

/* =========================
   RESPONSIVE TV
========================= */

@media(max-width:1200px){

  .brand-main{
    font-size:48px;
  }

  .css-logo{
    transform:scale(.86);
  }

  .screen-center{
    width:72vw;
  }

  .panel-title{
    font-size:22px;

    height:58px;
    min-height:58px;
  }

  .orders{
    grid-auto-rows:
      minmax(64px,82px);

    gap:8px;

    padding:12px;
  }

  .order-num{
    font-size:27px;
  }

  .panel-footer{
    font-size:11px;
  }

}

@media(max-width:700px){

  body{
    overflow:auto;
  }

  #display{
    min-height:100vh;
    height:auto;
  }

  .topbar{
    height:130px;
  }

  .brand-main{
    font-size:34px;
  }

  .brand-sub{
    font-size:14px;
  }

  .brand-line{
    width:60px;
  }

  .screen-center{
    width:94vw;
    height:auto;

    grid-template-columns:1fr;

    padding-bottom:20px;
  }

  .panel{
    min-height:390px;
  }

  .orders{
    grid-template-columns:
      repeat(4,1fr);
  }

  .soundbtn{
    font-size:12px;
    padding:7px 9px;
  }

  input{
    width:100%;
  }

}
</style>
</head>

<body>

<!-- =========================
     TV DISPLAY
========================= -->

<div id="display" style="display:none">

  <div class="left-decoration"></div>
  <div class="right-decoration"></div>

  <button
    id="soundBtn"
    class="soundbtn"
    style="display:none"
    onclick="enableSound()"
  >
    🔊 Ton aktivieren
  </button>

  <div class="topbar">

    <div class="brand">

      <div class="brand-main">

        <span class="palmo">
          PALMO
        </span>

        <span class="chicken-word">
          CHICKEN
        </span>

        <span class="css-logo">

          <span class="flame-tip"></span>

          <span class="flame-main"></span>

          <span class="flame-inner"></span>

        </span>

      </div>

      <div class="brand-sub-row">

        <span class="brand-line"></span>

        <span class="brand-sub">
          By Palmengrill
        </span>

        <span class="brand-line"></span>

      </div>

    </div>

  </div>

  <div class="screen-center">

    <!-- PREPARING -->

    <section class="panel prep">

      <div class="panel-title">

        <span class="prep-icon"></span>

        <span>
          IN ZUBEREITUNG
        </span>

      </div>

      <div
        id="prep"
        class="orders"
      ></div>

      <div class="panel-footer">
        VIELEN DANK, DASS DU HIER BIST!
      </div>

    </section>

    <!-- READY -->

    <section class="panel ready">

      <div class="panel-title">

        <span class="ready-icon"></span>

        <span>
          ABHOLBEREIT
        </span>

      </div>

      <div
        id="ready"
        class="orders"
      ></div>

      <div class="panel-footer">
        GUTEN APPETIT
      </div>

    </section>

  </div>

</div>


<!-- =========================
     CONTROL PANEL
========================= -->

<div id="control" style="display:none">

  <div class="controls">

    <div class="control-logo">
      PALMO <span>CHICKEN</span>
    </div>

    <div class="card">

      <h2>
        Neue Bestellnummer
      </h2>

      <input
        id="n"
        inputmode="numeric"
        placeholder="z.B. 125"
        autocomplete="off"
      >

      <button
        class="add"
        onclick="addOrder()"
      >
        Hinzufügen
      </button>

    </div>

    <div class="card">

      <h2>
        Aktuelle Bestellungen
      </h2>

      <div id="list"></div>

    </div>

  </div>

</div>


<script>

/* =========================
   FIREBASE
========================= */

var DB =
"https://palmen-grill-monitor-default-rtdb.europe-west1.firebasedatabase.app";


/* =========================
   URL MODE
========================= */

function getParameter(name){

  var query =
  window.location.search.substring(1);

  var vars =
  query.split("&");

  for(
    var i=0;
    i<vars.length;
    i++
  ){

    var pair =
    vars[i].split("=");

    if(pair[0]===name){

      return decodeURIComponent(
        pair[1] || ""
      );

    }

  }

  return null;

}


/*
NORMAL LINK = TV DISPLAY

?mode=control = CONTROL PANEL
*/

var mode =
getParameter("mode")
||
"display";


document
.getElementById(

  mode==="control"
  ?
  "control"
  :
  "display"

)
.style.display="block";


/* =========================
   SOUND VARIABLES
========================= */

var soundEnabled=false;

var previousReady={};

var firstLoad=true;

var audioPlayer=null;

var flashUntil={};


if(mode==="display"){

  document
  .getElementById("soundBtn")
  .style.display="inline-block";

}


/* =========================
   ENABLE SOUND
========================= */

function enableSound(){

  soundEnabled=true;

  document
  .getElementById("soundBtn")
  .innerHTML=
  "🔊 Ton aktiv";

  beep();

  setTimeout(
    function(){

      speak(
        "Ton ist aktiviert"
      );

    },
    500
  );

}


/* =========================
   GERMAN VOICE
========================= */

function speak(text){

  if(!soundEnabled){
    return;
  }

  try{

    var url =

    "https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=de&q="

    +

    encodeURIComponent(text);


    audioPlayer =
    new Audio(url);


    audioPlayer.volume=1;


    var p =
    audioPlayer.play();


    if(
      p &&
      p.catch
    ){

      p.catch(
        function(){

          beep();

        }
      );

    }


    audioPlayer.onerror=
    function(){

      beep();

    };


  }
  catch(e){

    beep();

  }

}


/* =========================
   FALLBACK BEEP
========================= */

function beep(){

  try{

    var AC =

    window.AudioContext

    ||

    window.webkitAudioContext;


    if(!AC){
      return;
    }


    var ctx =
    new AC();


    var osc =
    ctx.createOscillator();


    var gain =
    ctx.createGain();


    osc.connect(gain);

    gain.connect(
      ctx.destination
    );


    osc.frequency.value=
    880;


    gain.gain.value=
    0.5;


    osc.start();


    setTimeout(
      function(){

        try{

          osc.stop();

          ctx.close();

        }
        catch(e){}

      },
      500
    );


  }
  catch(e){}

}


/* =========================
   FIREBASE REQUEST
========================= */

function req(
  method,
  path,
  data,
  cb
){

  var x =
  new XMLHttpRequest();


  x.open(

    method,

    DB +
    path +
    ".json",

    true

  );


  x.setRequestHeader(

    "Content-Type",

    "application/json"

  );


  x.onreadystatechange=
  function(){

    if(
      x.readyState===4
      &&
      cb
    ){

      var r=null;


      try{

        r =
        JSON.parse(
          x.responseText
        );

      }
      catch(e){}


      cb(r);

    }

  };


  x.send(

    data===null

    ||

    data===undefined

    ?

    null

    :

    JSON.stringify(data)

  );

}


/* =========================
   ADD ORDER
========================= */

function addOrder(){

  var input =
  document
  .getElementById("n");


  var n =
  input.value
  .replace(
    /\D/g,
    ""
  );


  if(!n){
    return;
  }


  req(

    "GET",

    "/orders",

    null,

    function(data){


      data =
      data || {};


      var duplicate=false;


      Object
      .keys(data)
      .forEach(
        function(k){

          if(

            String(
              data[k].number
            )

            ===

            String(n)

          ){

            duplicate=true;

          }

        }
      );


      if(duplicate){

        alert(

          "Nummer "
          +
          n
          +
          " ist bereits vorhanden."

        );

        return;

      }


      req(

        "POST",

        "/orders",

        {

          number:n,

          status:"preparing",

          createdAt:
          Date.now()

        },

        function(){

          input.value="";

        }

      );

    }

  );

}


/* ENTER KEY */

var numberInput =
document.getElementById("n");

if(numberInput){

  numberInput.addEventListener(
    "keydown",
    function(e){

      if(e.key==="Enter"){

        addOrder();

      }

    }
  );

}


/* =========================
   SET READY
========================= */

function setReady(k){

  req(

    "PATCH",

    "/orders/" + k,

    {

      status:"ready",

      readyAt:
      Date.now()

    }

  );

}


/* =========================
   REMOVE ORDER
========================= */

function removeOrder(k){

  req(

    "DELETE",

    "/orders/" + k

  );

}


/* =========================
   RENDER ORDERS
========================= */

function render(data){

  data =
  data || {};


  var prep="";

  var ready="";

  var list="";


  var currentReady={};


  var now =
  Date.now();


  var keys =
  Object.keys(data);


/* SORT BY CREATION */

  keys.sort(
    function(a,b){

      var aa =
      data[a].createdAt || 0;


      var bb =
      data[b].createdAt || 0;


      return aa-bb;

    }
  );


/* LOOP */

  keys.forEach(
    function(k){


      var o =
      data[k];


      if(!o){
        return;
      }


      var number =
      String(
        o.number
      );


/* =========================
   READY ORDER
========================= */

      if(
        o.status==="ready"
      ){


        currentReady[k]=true;


/* NEW READY DETECTED */

        if(

          mode==="display"

          &&

          !firstLoad

          &&

          !previousReady[k]

        ){


          /* GREEN FLASH 5.2 SEC */

          flashUntil[k] =
          now + 5200;


          /* SPEAK NUMBER */

          speak(

            "Nummer "
            +
            number
            +
            ", bitte!"

          );

        }


/* SHOULD FLASH */

        var isNew =

        flashUntil[k]

        &&

        flashUntil[k] > now;


/* TV READY */

        ready +=

        '<div class="order-num'

        +

        (
          isNew
          ?
          ' new-ready'
          :
          ''
        )

        +

        '">'

        +

        number

        +

        '</div>';


/* CONTROL READY */

        list +=

        '<div class="row">'

        +

        '<b>'

        +

        number

        +

        '</b>'

        +

        '<span>ABHOLBEREIT</span>'

        +

        '<button class="done" onclick="removeOrder(\''

        +

        k

        +

        '\')">'

        +

        'Abgeholt'

        +

        '</button>'

        +

        '</div>';

      }


/* =========================
   PREPARING ORDER
========================= */

      else{


/* TV PREPARING */

        prep +=

        '<div class="order-num">'

        +

        number

        +

        '</div>';


/* CONTROL PREPARING */

        list +=

        '<div class="row">'

        +

        '<b>'

        +

        number

        +

        '</b>'

        +

        '<span>IN ZUBEREITUNG</span>'

        +

        '<button class="readybtn" onclick="setReady(\''

        +

        k

        +

        '\')">'

        +

        'Fertig'

        +

        '</button>'

        +

        '</div>';

      }

    }

  );


/* =========================
   READY STATE
========================= */

  previousReady =
  currentReady;


  firstLoad=false;


/* =========================
   TV
========================= */

  if(
    mode==="display"
  ){

    document
    .getElementById("prep")
    .innerHTML =
    prep || "";


    document
    .getElementById("ready")
    .innerHTML =
    ready || "";

  }


/* =========================
   CONTROL
========================= */

  else{

    document
    .getElementById("list")
    .innerHTML =

    list

    ||

========================= */

  req(

    "GET",

    "/orders",

    null,

      setTimeout(

        poll,

        1000

      );

    }

  );

}

poll();
