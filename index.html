<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PALMO CHICKEN</title>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
width:100%;
height:100%;
background:#070707;
font-family:Arial Black,Arial,sans-serif;
color:#fff;
}

body{overflow:hidden}

/* ===== TOP LOGO ===== */

header{
height:15vh;
min-height:100px;
background:linear-gradient(180deg,#070707,#111);
display:flex;
justify-content:center;
align-items:center;
position:relative;
border-bottom:2px solid #e00000;
}

.brandWrap{
display:flex;
align-items:center;
gap:14px;
}

.logoFlame{
width:55px;
height:64px;
filter:drop-shadow(0 0 10px #d40000);
}

.brandText{
text-align:left;
line-height:.9;
}

.brandMain{
font-size:54px;
font-weight:900;
letter-spacing:1px;
text-shadow:0 3px 8px #000;
white-space:nowrap;
}

.brandMain .palmo{color:#fff}
.brandMain .chicken{color:#ed1717}

.brandSub{
margin-top:13px;
font-size:20px;
color:#28b856;
font-family:Arial,sans-serif;
font-weight:bold;
text-align:center;
}

.soundbtn{
position:absolute;
right:20px;
top:22px;
background:#fff;
color:#111;
font-weight:bold;
border:0;
border-radius:10px;
padding:11px 15px;
font-size:15px;
}

/* ===== DISPLAY ===== */

#display{
height:85vh;
position:relative;
background:
radial-gradient(circle at center,#202020 0%,#090909 75%);
}

/* FOOD SIDES */

.food{
position:absolute;
top:0;
bottom:0;
width:23%;
background-repeat:no-repeat;
background-size:cover;
z-index:1;
}

.foodLeft{
left:0;
background-image:
linear-gradient(to right,
rgba(0,0,0,.05) 0%,
rgba(0,0,0,.05) 45%,
rgba(0,0,0,.9) 100%),
url("https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=1200&q=90");
background-position:center;
}

.foodRight{
right:0;
background-image:
linear-gradient(to left,
rgba(0,0,0,.05) 0%,
rgba(0,0,0,.05) 45%,
rgba(0,0,0,.9) 100%),
url("https://images.unsplash.com/photo-1613315981117-141e49472cfd?auto=format&fit=crop&w=1200&q=90");
background-position:center;
}

/* PANELS */

.grid{
position:relative;
z-index:5;
width:70%;
height:100%;
margin:auto;
display:flex;
gap:14px;
padding:16px 0;
}

.box{
width:50%;
height:100%;
background:rgba(19,20,23,.96);
border:3px solid #a90000;
border-radius:17px;
overflow:hidden;
display:flex;
flex-direction:column;
box-shadow:
0 0 10px rgba(255,0,0,.35),
inset 0 0 30px rgba(0,0,0,.5);
}

.box h2{
margin:0;
padding:18px 8px;
text-align:center;
font-size:29px;
font-weight:900;
letter-spacing:.5px;
background:
linear-gradient(180deg,#f01a1a,#a60000);
text-shadow:0 2px 5px #650000;
border-bottom:2px solid #ff3838;
}

.orders{
padding:22px;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:18px;
align-content:start;
flex:1;
}

/* NORMAL PREPARING NUMBER */

.num{
min-height:105px;
border-radius:15px;
display:flex;
align-items:center;
justify-content:center;
position:relative;
font-size:55px;
font-weight:900;
background:linear-gradient(145deg,#333,#1c1c1c);
border:2px solid #484848;
box-shadow:0 7px 15px rgba(0,0,0,.5);
}

/* READY NUMBER AFTER FLASH */

.ready .num{
background:
linear-gradient(145deg,#076e52,#084b3d);
border:2px solid #18bf8a;
box-shadow:
0 0 10px rgba(18,211,153,.35),
inset 0 0 16px rgba(30,255,190,.12);
}

/* NEW READY — TURQUOISE FLASH */

.ready .num.new-ready{
background:
linear-gradient(145deg,#22d9ae,#079b82)!important;
border:3px solid #4effd7!important;
box-shadow:
0 0 12px #2affd5,
0 0 30px #13cfae,
0 0 55px rgba(30,255,215,.75)!important;
animation:readyFlash .60s ease-in-out 8;
transform-origin:center;
}

@keyframes readyFlash{
0%,100%{
transform:scale(1);
filter:brightness(1);
}
50%{
transform:scale(1.08);
filter:brightness(1.35);
}
}

.miniLogo{
position:absolute;
top:5px;
left:7px;
display:flex;
align-items:center;
gap:3px;
font-family:Arial,sans-serif;
font-size:9px;
font-weight:bold;
color:#fff;
opacity:.98;
}

.miniLogo svg{
width:17px;
height:20px;
}

.numText{
display:block;
}

/* FOOTERS */

.footerText{
height:52px;
display:flex;
align-items:center;
justify-content:center;
font-family:Arial,sans-serif;
font-weight:900;
font-size:17px;
letter-spacing:.5px;
text-align:center;
}

/* ===== CONTROL ===== */

#control{
height:85vh;
overflow:auto;
}

.controls{
max-width:850px;
margin:20px auto;
padding:10px;
font-family:Arial,sans-serif;
}

.card{
background:#191919;
padding:18px;
border-radius:16px;
margin-bottom:15px;
border:1px solid #333;
}

.card h2{
margin:0 0 15px;
}

input{
font-size:27px;
padding:13px;
width:64%;
border:0;
border-radius:9px;
}

button{
font-size:18px;
padding:12px 14px;
border:0;
border-radius:10px;
margin:4px;
}

.add{
background:#fff;
color:#111;
}

.readybtn{
background:#0aa776;
color:#fff;
}

.done{
background:#555;
color:#fff;
}

.row{
padding:13px;
background:#252525;
margin:8px 0;
border-radius:10px;
font-size:19px;
}

/* TV SMALLER RESOLUTION */

@media(max-width:1100px){

.brandMain{font-size:43px}
.logoFlame{width:46px;height:54px}

.grid{width:72%}

.box h2{font-size:24px}

.orders{
grid-template-columns:repeat(2,1fr);
padding:17px;
gap:13px;
}

.num{
font-size:47px;
min-height:93px;
}

.food{width:24%}

.footerText{font-size:14px}
}

</style>
</head>

<body>

<header>

<div class="brandWrap">

<svg class="logoFlame"
viewBox="0 0 100 120"
xmlns="http://www.w3.org/2000/svg">

<path
d="M52 3
C56 27 83 29 83 60
C83 91 64 111 49 116
C22 109 8 92 8 68
C8 47 21 36 31 23
C31 40 38 45 44 45
C51 45 56 35 52 3Z"
fill="#df1515"/>

<path
d="M52 46
C58 60 70 65 70 79
C70 96 59 106 49 110
C36 105 29 94 29 82
C29 70 38 62 42 53
C43 65 48 68 52 68
C57 68 59 60 52 46Z"
fill="#fff"/>

</svg>

<div class="brandText">
<div class="brandMain">
<span class="palmo">PALMO</span>
<span class="chicken"> CHICKEN</span>
</div>

<div class="brandSub">
By palmen grill
</div>
</div>

</div>

<button
id="soundBtn"
class="soundbtn"
style="display:none"
onclick="enableSound()">
🔊 Ton aktivieren
</button>

</header>


<div id="display" style="display:none">

<div class="food foodLeft"></div>
<div class="food foodRight"></div>

<div class="grid">

<div class="box prep">

<h2>IN ZUBEREITUNG</h2>

<div id="prep" class="orders"></div>

<div class="footerText">
DANKE, DASS DU HIER BIST!
</div>

</div>


<div class="box ready">

<h2>ABHOLBEREIT</h2>

<div id="ready" class="orders"></div>

<div class="footerText">
GUTEN APPETIT!
</div>

</div>

</div>
</div>


<div id="control"
class="controls"
style="display:none">

<div class="card">

<h2>Neue Bestellnummer</h2>

<input
id="n"
inputmode="numeric"
placeholder="z.B. 125">

<button
class="add"
onclick="addOrder()">
Hinzufügen
</button>

</div>


<div class="card">

<h2>Aktuelle Bestellungen</h2>

<div id="list"></div>

</div>

</div>


<script>

var DB=
"https://palmen-grill-monitor-default-rtdb.europe-west1.firebasedatabase.app";


function getParameter(name){

var q=
window.location.search
.substring(1)
.split("&");

for(var i=0;i<q.length;i++){

var p=q[i].split("=");

if(p[0]===name){
return decodeURIComponent(p[1]||"");
}

}

return null;
}


var mode=
getParameter("mode")||
"display";


document
.getElementById(
mode==="control"
?"control"
:"display"
)
.style.display="block";


var soundEnabled=false;
var previousReady={};
var firstLoad=true;
var audioPlayer=null;
var flashUntil={};


if(mode==="display"){

document
.getElementById("soundBtn")
.style.display="inline-block";

}


function enableSound(){

soundEnabled=true;

document
.getElementById("soundBtn")
.innerHTML="🔊 Ton aktiv";

beep();

setTimeout(function(){

speak("Ton ist aktiviert");

},500);

}


function speak(text){

if(!soundEnabled)return;

try{

var url=
"https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=de&q="
+encodeURIComponent(text);

audioPlayer=
new Audio(url);

audioPlayer.volume=1;

var p=
audioPlayer.play();

if(p&&p.catch){

p.catch(function(){
beep();
});

}

audioPlayer.onerror=function(){
beep();
};

}catch(e){

beep();

}

}


function beep(){

try{

var AC=
window.AudioContext||
window.webkitAudioContext;

if(!AC)return;

var ctx=new AC();

var osc=
ctx.createOscillator();

var gain=
ctx.createGain();

osc.connect(gain);
gain.connect(ctx.destination);

osc.frequency.value=880;
gain.gain.value=.5;

osc.start();

setTimeout(function(){

try{
osc.stop();
ctx.close();
}catch(e){}

},500);

}catch(e){}

}


function req(method,path,data,cb){

var x=
new XMLHttpRequest();

x.open(
method,
DB+path+".json",
true
);

x.setRequestHeader(
"Content-Type",
"application/json"
);

x.onreadystatechange=function(){

if(x.readyState===4&&cb){

var r=null;

try{
r=JSON.parse(x.responseText);
}catch(e){}

cb(r);

}

};

x.send(
data===null||
data===undefined
?null
:JSON.stringify(data)
);

}


function addOrder(){

var input=
document.getElementById("n");

var n=
input.value.replace(/\D/g,"");

if(!n)return;


req(
"GET",
"/orders",
null,
function(data){

data=data||{};

var duplicate=false;


Object.keys(data)
.forEach(function(k){

if(
String(data[k].number)===
String(n)
){

duplicate=true;

}

});


if(duplicate){

alert(
"Nummer "+n+
" ist bereits vorhanden."
);

return;

}


req(
"POST",
"/orders",
{
number:n,
status:"preparing",
createdAt:Date.now()
},
function(){

input.value="";

}
);

}
);

}


function setReady(k){

req(
"PATCH",
"/orders/"+k,
{
status:"ready",
readyAt:Date.now()
}
);

}


function removeOrder(k){

req(
"DELETE",
"/orders/"+k
);

}


/* SMALL PALMO LOGO INSIDE NEW READY NUMBER */

function miniLogo(){

return `
<span class="miniLogo">

<svg
viewBox="0 0 100 120"
xmlns="http://www.w3.org/2000/svg">

<path
d="M52 3
C56 27 83 29 83 60
C83 91 64 111 49 116
C22 109 8 92 8 68
C8 47 21 36 31 23
C31 40 38 45 44 45
C51 45 56 35 52 3Z"
fill="#df1515"/>

<path
d="M52 46
C58 60 70 65 70 79
C70 96 59 106 49 110
C36 105 29 94 29 82
C29 70 38 62 42 53
C43 65 48 68 52 68
C57 68 59 60 52 46Z"
fill="#fff"/>

</svg>

PALMO

</span>
`;

}


function render(data){

data=data||{};

var prep="";
var ready="";
var list="";

var currentReady={};

var now=
Date.now();


Object.keys(data)
.forEach(function(k){

var o=data[k];


if(o.status==="ready"){

currentReady[k]=true;


if(
mode==="display" &&
!firstLoad &&
!previousReady[k]
){

flashUntil[k]=
now+5000;

speak(
"Nummer "+
o.number+
", bitte!"
);

}


var isFlashing=
flashUntil[k] &&
flashUntil[k]>now;


ready+=
'<div class="num'+
(isFlashing?' new-ready':'')+
'">'+

(isFlashing
?miniLogo()
:'')+

'<span class="numText">'+
o.number+
'</span>'+
'</div>';


list+=
'<div class="row">'+

'<b>'+
o.number+
'</b> ABHOLBEREIT '+

'<button class="done" '+
'onclick="removeOrder(\''+
k+
'\')">'+
'Abgeholt'+
'</button>'+

'</div>';


}else{


prep+=
'<div class="num">'+
'<span class="numText">'+
o.number+
'</span>'+
'</div>';


list+=
'<div class="row">'+

'<b>'+
o.number+
'</b> IN ZUBEREITUNG '+

'<button class="readybtn" '+
'onclick="setReady(\''+
k+
'\')">'+
'Fertig'+
'</button>'+

'</div>';

}

});


previousReady=
currentReady;

firstLoad=false;


if(mode==="display"){

document
.getElementById("prep")
.innerHTML=prep;

document
.getElementById("ready")
.innerHTML=ready;

}else{

document
.getElementById("list")
.innerHTML=
list||
"Keine Bestellungen";

}

}


function poll(){

req(
"GET",
"/orders",
null,
function(d){

render(d);

setTimeout(
poll,
1000
);

}
);

}


poll();

</script>

</body>
</html>
