<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PALMO CHICKEN</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#080808;
color:white;
overflow-x:hidden;
}

header{
height:14vh;
min-height:105px;
display:flex;
align-items:center;
justify-content:center;
position:relative;
background:#050505;
border-bottom:3px solid #b40000;
}

.brand{
text-align:center;
font-weight:bold;
line-height:.9;
}

.brand-main{
font-size:54px;
letter-spacing:2px;
}

.brand-main .palmo{color:white}
.brand-main .chicken{color:#e11111}

.brand-sub{
font-size:23px;
margin-top:12px;
color:#22a447;
}

.soundbtn{
position:absolute;
right:20px;
top:20px;
background:white;
color:#111;
font-weight:bold;
border:0;
border-radius:10px;
padding:11px 15px;
font-size:16px;
}

/* DISPLAY */

#display{
min-height:86vh;
position:relative;
}

.food-left,
.food-right{
position:absolute;
top:0;
bottom:0;
width:20%;
background-size:cover;
background-position:center;
opacity:.95;
}

.food-left{
left:0;
background-image:
linear-gradient(to right,rgba(0,0,0,.1),rgba(0,0,0,.85)),
url('https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=900&q=85');
}

.food-right{
right:0;
background-image:
linear-gradient(to left,rgba(0,0,0,.1),rgba(0,0,0,.85)),
url('https://images.unsplash.com/photo-1532550907401-a500c9a57435?auto=format&fit=crop&w=900&q=85');
}

.grid{
position:relative;
z-index:2;
display:flex;
width:72%;
margin:auto;
padding-top:20px;
gap:14px;
min-height:81vh;
}

.box{
width:50%;
background:rgba(20,20,20,.96);
border:2px solid #9c0000;
border-radius:16px;
overflow:hidden;
display:flex;
flex-direction:column;
}

.box h2{
margin:0;
padding:18px 10px;
font-size:30px;
text-align:center;
background:linear-gradient(#d11313,#8d0000);
}

.orders{
padding:18px;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:14px;
align-content:start;
flex:1;
}

.num{
font-size:60px;
font-weight:bold;
text-align:center;
background:#292929;
border-radius:14px;
padding:24px 8px;
border:2px solid #444;
position:relative;
}

.ready .num{
background:#123a22;
border-color:#237d45;
}

.new-ready{
background:#d00000!important;
border:3px solid #ff3131!important;
box-shadow:0 0 15px #ff1d1d,0 0 35px #ff0000;
animation:flash .62s ease-in-out 8;
}

.new-ready:before{
content:"PALMO";
display:block;
font-size:13px;
font-weight:bold;
letter-spacing:1px;
margin-bottom:3px;
color:white;
}

@keyframes flash{
0%,100%{transform:scale(1);box-shadow:0 0 12px #e00000}
50%{transform:scale(1.07);box-shadow:0 0 35px #ff0000}
}

.footerText{
padding:15px 6px 18px;
text-align:center;
font-weight:bold;
font-size:19px;
letter-spacing:1px;
color:#eee;
}

/* CONTROL */

.controls{
max-width:850px;
margin:25px auto;
padding:10px;
}

.card{
background:#191919;
padding:18px;
border-radius:16px;
margin-bottom:14px;
}

.card h2{
margin-top:0;
}

input{
font-size:27px;
padding:13px;
width:62%;
border-radius:8px;
border:0;
}

button{
font-size:18px;
padding:12px 14px;
border:0;
border-radius:10px;
margin:4px;
}

.add{background:white}
.readybtn{background:#168346;color:white}
.done{background:#555;color:white}

.row{
padding:13px;
background:#252525;
margin:8px 0;
border-radius:10px;
font-size:20px;
}

@media(max-width:900px){
.food-left,.food-right{width:16%}
.grid{width:80%}
.brand-main{font-size:40px}
.num{font-size:44px}
.orders{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

<body>

<header>
<div class="brand">
<div class="brand-main">
<span class="palmo">PALMO</span>
<span class="chicken"> CHICKEN</span>
</div>
<div class="brand-sub">By palmen grill</div>
</div>

<button
id="soundBtn"
class="soundbtn"
style="display:none"
onclick="enableSound()">
🔊 Ton aktivieren
</button>
</header>


<div id="display" style="display:none">

<div class="food-left"></div>
<div class="food-right"></div>

<div class="grid">

<div class="box prep">
<h2>IN ZUBEREITUNG</h2>
<div id="prep" class="orders"></div>
<div class="footerText">
DANKE, DASS DU HIER BIST!
</div>
</div>

<div class="box ready">
<h2>ABHOLBEREIT</h2>
<div id="ready" class="orders"></div>
<div class="footerText">
GUTEN APPETIT!
</div>
</div>

</div>
</div>


<div id="control" class="controls" style="display:none">

<div class="card">
<h2>Neue Bestellnummer</h2>

<input
id="n"
inputmode="numeric"
placeholder="z.B. 125">

<button class="add" onclick="addOrder()">
Hinzufügen
</button>
</div>


<div class="card">
<h2>Aktuelle Bestellungen</h2>
<div id="list"></div>
</div>

</div>


<script>

var DB=
"https://palmen-grill-monitor-default-rtdb.europe-west1.firebasedatabase.app";

function getParameter(name){
var q=window.location.search.substring(1).split("&");
for(var i=0;i<q.length;i++){
var p=q[i].split("=");
if(p[0]===name)return decodeURIComponent(p[1]||"");
}
return null;
}

var mode=getParameter("mode")||"display";

document.getElementById(
mode==="control" ? "control" : "display"
).style.display="block";


var soundEnabled=false;
var previousReady={};
var firstLoad=true;
var audioPlayer=null;
var flashUntil={};

if(mode==="display"){
document.getElementById("soundBtn").style.display="inline-block";
}

function enableSound(){
soundEnabled=true;
document.getElementById("soundBtn").innerHTML="🔊 Ton aktiv";
beep();
setTimeout(function(){speak("Ton ist aktiviert")},500);
}

function speak(text){
if(!soundEnabled)return;

try{
var url=
"https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=de&q="
+encodeURIComponent(text);

audioPlayer=new Audio(url);
audioPlayer.volume=1;

var p=audioPlayer.play();
if(p&&p.catch)p.catch(function(){beep()});

audioPlayer.onerror=function(){beep()};

}catch(e){beep()}
}

function beep(){
try{
var AC=window.AudioContext||window.webkitAudioContext;
if(!AC)return;

var ctx=new AC();
var osc=ctx.createOscillator();
var gain=ctx.createGain();

osc.connect(gain);
gain.connect(ctx.destination);

osc.frequency.value=880;
gain.gain.value=.5;

osc.start();

setTimeout(function(){
try{
osc.stop();
ctx.close();
}catch(e){}
},500);

}catch(e){}
}


function req(method,path,data,cb){

var x=new XMLHttpRequest();

x.open(method,DB+path+".json",true);

x.setRequestHeader(
"Content-Type",
"application/json"
);

x.onreadystatechange=function(){

if(x.readyState===4&&cb){

var r=null;

try{
r=JSON.parse(x.responseText);
}catch(e){}

cb(r);

}

};

x.send(
data===null||data===undefined
?null
:JSON.stringify(data)
);

}


function addOrder(){

var input=document.getElementById("n");
var n=input.value.replace(/\D/g,"");

if(!n)return;

req("GET","/orders",null,function(data){

data=data||{};
var duplicate=false;

Object.keys(data).forEach(function(k){

if(String(data[k].number)===String(n)){
duplicate=true;
}

});

if(duplicate){
alert("Nummer "+n+" ist bereits vorhanden.");
return;
}

req(
"POST",
"/orders",
{
number:n,
status:"preparing",
createdAt:Date.now()
},
function(){
input.value="";
}
);

});

}


function setReady(k){

req(
"PATCH",
"/orders/"+k,
{
status:"ready",
readyAt:Date.now()
}
);

}


function removeOrder(k){
req("DELETE","/orders/"+k);
}


function render(data){

data=data||{};

var prep="";
var ready="";
var list="";
var currentReady={};
var now=Date.now();

Object.keys(data).forEach(function(k){

var o=data[k];

if(o.status==="ready"){

currentReady[k]=true;

if(
mode==="display" &&
!firstLoad &&
!previousReady[k]
){
flashUntil[k]=now+5000;
speak("Nummer "+o.number+", bitte!");
}

var flash=
flashUntil[k]&&flashUntil[k]>now
?" new-ready"
:"";

ready+=
'<div class="num'+flash+'">'+
o.number+
'</div>';

list+=
'<div class="row">'+
'<b>'+o.number+'</b> ABHOLBEREIT '+
'<button class="done" onclick="removeOrder(\''+
k+
'\')">Abgeholt</button>'+
'</div>';

}else{

prep+=
'<div class="num">'+
o.number+
'</div>';

list+=
'<div class="row">'+
'<b>'+o.number+'</b> IN ZUBEREITUNG '+
'<button class="readybtn" onclick="setReady(\''+
k+
'\')">Fertig</button>'+
'</div>';

}

});

previousReady=currentReady;
firstLoad=false;

if(mode==="display"){

document.getElementById("prep").innerHTML=prep;
document.getElementById("ready").innerHTML=ready;

}else{

document.getElementById("list").innerHTML=
list||"Keine Bestellungen";

}

}


function poll(){

req(
"GET",
"/orders",
null,
function(d){

render(d);

setTimeout(poll,1000);

}
);

}

poll();

</script>

</body>
</html>
