<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PALMO CHICKEN</title>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
width:100%;
height:100%;
background:#050505;
color:#fff;
}

body{
font-family:Arial,Helvetica,sans-serif;
overflow:hidden;
}

/* ===== BACKGROUND ===== */

#display{
width:100vw;
height:100vh;
position:relative;
overflow:hidden;

background:
linear-gradient(45deg,#101010 25%,transparent 25%) 0 0/52px 52px,
linear-gradient(45deg,transparent 75%,#101010 75%) 0 0/52px 52px,
linear-gradient(45deg,transparent 75%,#101010 75%) 26px -26px/52px 52px,
linear-gradient(45deg,#101010 25%,#080808 25%,#080808 75%,#101010 75%,#101010) 26px 26px/52px 52px;
}

/* ===== FOOD ===== */

.side-food{
position:absolute;
top:0;
bottom:0;
width:18.5vw;
min-width:170px;
background-repeat:no-repeat;
background-size:cover;
z-index:1;
}

.food-left{
left:0;

background-image:
linear-gradient(
to right,
rgba(0,0,0,.02) 0%,
rgba(0,0,0,.04) 56%,
rgba(0,0,0,.86) 100%
),
url("https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=1000&q=90");

background-position:center;
}

.food-right{
right:0;

background-image:
linear-gradient(
to left,
rgba(0,0,0,.02) 0%,
rgba(0,0,0,.04) 56%,
rgba(0,0,0,.86) 100%
),
url("https://images.unsplash.com/photo-1598103442097-8b74394b95c6?auto=format&fit=crop&w=1000&q=90");

background-position:center;
}

/* ===== BRAND ===== */

.topbar{
position:relative;
z-index:5;

height:20vh;
min-height:125px;

display:flex;
align-items:center;
justify-content:center;

padding-top:8px;
}

.brand{
position:relative;
text-align:center;
min-width:620px;
}

.brand-main{
display:flex;
justify-content:center;
align-items:center;
gap:10px;

font-family:"Arial Black",Impact,Arial,sans-serif;

font-size:58px;
font-weight:900;

letter-spacing:-2px;
line-height:.95;

text-shadow:0 4px 8px #000;

white-space:nowrap;
}

.brand-main .palmo{
color:#fff;
}

.brand-main .chicken-word{
color:#ed261d;
}

.brand-sub-row{
margin-top:7px;

display:flex;
align-items:center;
justify-content:center;

gap:10px;
}

.brand-line{
width:110px;
height:3px;

background:#c91f18;

border-radius:3px;
}

.brand-sub{
font-size:18px;
font-weight:700;
color:#fff;
}

/* PALMO LOGO */

.brand-logo{
position:absolute;

right:8px;
top:-12px;

width:68px;
height:68px;

display:flex;
align-items:center;
justify-content:center;

background:#d71919;

clip-path:polygon(
50% 0%,
66% 24%,
83% 40%,
94% 62%,
82% 84%,
50% 100%,
18% 84%,
6% 62%,
17% 40%,
34% 24%
);

font-family:"Arial Black",Arial,sans-serif;
font-size:11px;
font-weight:900;

color:#fff;

filter:drop-shadow(0 2px 4px #000);
}

/* SOUND */

.soundbtn{
position:absolute;

right:18px;
top:18px;

z-index:20;

background:#fff;
color:#111;

font-size:15px;
font-weight:700;

border:0;
border-radius:9px;

padding:10px 14px;
}

/* ===== CENTER ===== */

.screen-center{
position:relative;
z-index:5;

width:68vw;
margin:0 auto;

height:76vh;

display:grid;

grid-template-columns:1fr 1fr;

gap:12px;

padding-bottom:16px;
}

/* ===== PANELS ===== */

.panel{
min-width:0;
height:100%;

background:rgba(8,8,8,.92);

/* إطار أحمر أنحف */
border:1px solid #b91814;

border-radius:9px;

display:flex;
flex-direction:column;

overflow:hidden;

/* وهج أحمر أخف */
box-shadow:
0 0 8px rgba(255,0,0,.08);
}

.panel-title{
height:66px;
min-height:66px;

display:flex;
align-items:center;
justify-content:center;

gap:14px;

padding:0 12px;

background:
linear-gradient(
180deg,
#b30d09,
#790806
);

/* خط أحمر أنحف */
border-bottom:1px solid #d6241c;

font-family:"Arial Black",Impact,Arial,sans-serif;

font-size:27px;
font-weight:900;

letter-spacing:-.5px;

white-space:nowrap;
}

.title-icon{
width:35px;
height:35px;

display:flex;
align-items:center;
justify-content:center;

font-size:28px;
}

/* ===== ORDERS ===== */

.orders{
flex:1;

padding:14px 14px 10px;

display:grid;

grid-template-columns:
repeat(4,minmax(0,1fr));

grid-auto-rows:
minmax(72px,92px);

align-content:start;

gap:10px;
}

/* مربع الرقم */

.order-num{
position:relative;

display:flex;
align-items:center;
justify-content:center;

min-width:0;

border-radius:5px;

background:
linear-gradient(
145deg,
#262626,
#111
);

/* إطار الرقم نفسه 1px */
border:1px solid #343434;

font-family:
"Arial Black",
Impact,
Arial,
sans-serif;

font-size:31px;
font-weight:900;

color:#fff;

box-shadow:
inset 0 0 8px rgba(255,255,255,.02),
0 3px 7px rgba(0,0,0,.35);
}

/* READY NORMAL */

.ready .order-num{
background:
linear-gradient(
145deg,
#242424,
#101010
);

border:1px solid #343434;
}

/* ===== NEW READY FLASH ===== */

.ready .order-num.new-ready{

background:
linear-gradient(
145deg,
#20d8ad,
#067b65
)!important;

border:
1px solid #57ffda!important;

color:#fff;

box-shadow:
0 0 8px #37f5d0,
0 0 20px rgba(31,230,186,.8),
inset 0 0 12px rgba(255,255,255,.12)
!important;

animation:
greenFlash .58s ease-in-out 9;
}

@keyframes greenFlash{

0%,100%{
transform:scale(1);
filter:brightness(1);
}

50%{
transform:scale(1.07);
filter:brightness(1.35);
}

}

/* FLASH LINES */

.ready .order-num.new-ready::before,
.ready .order-num.new-ready::after{

content:"";

position:absolute;

width:10px;
height:2px;

top:50%;

background:#58ffda;

box-shadow:
0 -13px 0 #58ffda,
0 13px 0 #58ffda;
}

.ready .order-num.new-ready::before{
left:-13px;
}

.ready .order-num.new-ready::after{
right:-13px;
}

/* ===== FOOTER ===== */

.panel-footer{

height:42px;
min-height:42px;

display:flex;
align-items:center;
justify-content:center;

gap:9px;

padding:0 10px;

font-size:13px;
font-weight:900;

letter-spacing:.15px;

white-space:nowrap;
}

.panel-footer::before,
.panel-footer::after{

content:"";

height:1px;

background:#c91f18;

flex:1;

max-width:42px;
}

/* ===== CONTROL PANEL ===== */

#control{

min-height:100vh;

overflow:auto;

background:#111;

padding:18px;
}

.controls{

max-width:820px;

margin:auto;
}

.card{

background:#1c1c1c;

padding:18px;

border-radius:16px;

margin-bottom:14px;
}

.card h2{

margin:0 0 15px;
}

input{

width:64%;

min-width:180px;

font-size:28px;

padding:13px;

border:0;

border-radius:9px;
}

button{

font-size:18px;

padding:12px 14px;

border:0;

border-radius:10px;

margin:4px;
}

.add{

background:#fff;

color:#111;
}

.readybtn{

background:#079a73;

color:#fff;
}

.done{

background:#555;

color:#fff;
}

.row{

padding:13px;

background:#282828;

margin:8px 0;

border-radius:10px;

font-size:19px;
}

/* ===== TV ===== */

@media(max-width:1200px){

.brand-main{
font-size:48px;
}

.brand{
min-width:520px;
}

.brand-logo{
width:62px;
height:62px;
}

.screen-center{
width:70vw;
}

.panel-title{

font-size:22px;

height:58px;
min-height:58px;
}

.orders{

grid-auto-rows:
minmax(64px,82px);

gap:8px;

padding:12px;
}

.order-num{

font-size:27px;
}

.panel-footer{

font-size:11px;
}

}
</style>
</head>

<body>

<!-- ================= DISPLAY ================= -->

<div
id="display"
style="display:none"
>

<div
class="side-food food-left">
</div>

<div
class="side-food food-right">
</div>

<button
id="soundBtn"
class="soundbtn"
style="display:none"
onclick="enableSound()"
>
🔊 Ton aktivieren
</button>


<div class="topbar">

<div class="brand">

<div class="brand-main">

<span class="palmo">
PALMO
</span>

<span class="chicken-word">
CHICKEN
</span>

</div>


<div class="brand-logo">
PALMO
</div>


<div class="brand-sub-row">

<span class="brand-line">
</span>

<span class="brand-sub">
By Palmengrill
</span>

<span class="brand-line">
</span>

</div>

</div>

</div>


<div class="screen-center">


<section class="panel prep">

<div class="panel-title">

<span class="title-icon">
♨
</span>

<span>
IN ZUBEREITUNG
</span>

</div>


<div
id="prep"
class="orders">
</div>


<div class="panel-footer">

VIELEN DANK, DASS DU HIER BIST!

</div>

</section>



<section class="panel ready">

<div class="panel-title">

<span class="title-icon">
▣
</span>

<span>
ABHOLBEREIT
</span>

</div>


<div
id="ready"
class="orders">
</div>


<div class="panel-footer">

GUTEN APPETIT

</div>

</section>


</div>
</div>


<!-- ================= CONTROL ================= -->

<div
id="control"
style="display:none"
>

<div class="controls">


<div class="card">

<h2>
Neue Bestellnummer
</h2>

<input
id="n"
inputmode="numeric"
placeholder="z.B. 125"
>

<button
class="add"
onclick="addOrder()"
>
Hinzufügen
</button>

</div>


<div class="card">

<h2>
Aktuelle Bestellungen
</h2>

<div id="list">
</div>

</div>


</div>
</div>


<script>

/* ================= FIREBASE ================= */

var DB=
"https://palmen-grill-monitor-default-rtdb.europe-west1.firebasedatabase.app";


function getParameter(name){

var query=
window.location.search.substring(1);

var vars=
query.split("&");

for(
var i=0;
i<vars.length;
i++
){

var pair=
vars[i].split("=");

if(
pair[0]===name
){

return decodeURIComponent(
pair[1]||""
);

}

}

return null;

}


/* DEFAULT = TV DISPLAY */

var mode=
getParameter("mode")
||
"display";


document
.getElementById(
mode==="control"
?
"control"
:
"display"
)
.style.display="block";


/* ================= SOUND ================= */

var soundEnabled=false;

var previousReady={};

var firstLoad=true;

var audioPlayer=null;

var flashUntil={};


if(
mode==="display"
){

document
.getElementById("soundBtn")
.style.display="inline-block";

}


function enableSound(){

soundEnabled=true;

document
.getElementById("soundBtn")
.innerHTML=
"🔊 Ton aktiv";

beep();

setTimeout(
function(){

speak(
"Ton ist aktiviert"
);

},
500
);

}


function speak(text){

if(
!soundEnabled
)
return;

try{

var url=

"https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=de&q="

+
encodeURIComponent(text);


audioPlayer=
new Audio(url);

audioPlayer.volume=1;


var p=
audioPlayer.play();


if(
p &&
p.catch
){

p.catch(
function(){

beep();

}
);

}


audioPlayer.onerror=
function(){

beep();

};


}
catch(e){

beep();

}

}


function beep(){

try{

var AC=

window.AudioContext

||

window.webkitAudioContext;


if(
!AC
)
return;


var ctx=
new AC();


var osc=
ctx.createOscillator();


var gain=
ctx.createGain();


osc.connect(gain);

gain.connect(
ctx.destination
);


osc.frequency.value=
880;


gain.gain.value=
0.5;


osc.start();


setTimeout(
function(){

try{

osc.stop();

ctx.close();

}
catch(e){}

},
500
);


}
catch(e){}

}


/* ================= REQUEST ================= */

function req(
method,
path,
data,
cb
){

var x=
new XMLHttpRequest();


x.open(

method,

DB+
path+
".json",

true

);


x.setRequestHeader(

"Content-Type",

"application/json"

);


x.onreadystatechange=
function(){

if(
x.readyState===4
&&
cb
){

var r=null;


try{

r=
JSON.parse(
x.responseText
);

}
catch(e){}


cb(r);

}

};


x.send(

data===null
||
data===undefined

?

null

:

JSON.stringify(data)

);

}


/* ================= ADD ORDER ================= */

function addOrder(){

var input=
document
.getElementById("n");


var n=
input.value
.replace(
/\D/g,
""
);


if(
!n
)
return;


req(

"GET",

"/orders",

null,

function(data){

data=
data||{};


var duplicate=false;


Object
.keys(data)
.forEach(
function(k){

if(

String(
data[k].number
)

===

String(n)

){

duplicate=true;

}

}
);


if(
duplicate
){

alert(

"Nummer "
+
n
+
" ist bereits vorhanden."

);

return;

}


/* ADD */

req(

"POST",

"/orders",

{

number:n,

status:"preparing",

createdAt:
Date.now()

},

function(){

input.value="";

}

);

}

);

}


/* ================= READY ================= */

function setReady(k){

req(

"PATCH",

"/orders/"+k,

{

status:"ready",

readyAt:
Date.now()

}

);

}


/* ================= REMOVE ================= */

function removeOrder(k){

req(

"DELETE",

"/orders/"+k

);

}


/* ================= RENDER ================= */

function render(data){

data=
data||{};


var prep="";

var ready="";

var list="";


var currentReady={};


var now=
Date.now();


var keys=
Object.keys(data);


keys.sort(
function(a,b){

var aa=
data[a].createdAt||0;

var bb=
data[b].createdAt||0;

return aa-bb;

}
);


keys.forEach(
function(k){

var o=
data[k];


var number=
String(
o.number
);


if(
o.status==="ready"
){

currentReady[k]=true;


/* NEW READY */

if(

mode==="display"

&&

!firstLoad

&&

!previousReady[k]

){

flashUntil[k]=
now+5200;


speak(

"Nummer "
+
number
+
", bitte!"

);

}


var isNew=

flashUntil[k]

&&

flashUntil[k]>now;


/* READY TILE */

ready+=

'<div class="order-num'

+

(
isNew
?
' new-ready'
:
''
)

+

'">'

+

number

+

'</div>';


/* CONTROL */

list+=

'<div class="row">'

+

'<b>'

+

number

+

'</b> ABHOLBEREIT '

+

'<button class="done" onclick="removeOrder(\''

+

k

+

'\')">Abgeholt</button>'

+

'</div>';


}
else{


/* PREPARING */

prep+=

'<div class="order-num">'

+

number

+

'</div>';


/* CONTROL */

list+=

'<div class="row">'

+

'<b>'

+

number

+

'</b> IN ZUBEREITUNG '

+

'<button class="readybtn" onclick="setReady(\''

+

k

+

'\')">Fertig</button>'

+

'</div>';

}

}
);


previousReady=
currentReady;


firstLoad=false;


/* DISPLAY */

if(
mode==="display"
){

document
.getElementById("prep")
.innerHTML=
prep;


document
.getElementById("ready")
.innerHTML=
ready;

}


/* CONTROL */

else{

document
.getElementById("list")
.innerHTML=

list

||

"Keine Bestellungen";

}

}


/* ================= AUTO UPDATE ================= */

function poll(){

req(

"GET",

"/orders",

null,

function(d){

render(d);


setTimeout(

poll,

1000

);

}

);

}


poll();

</script>

</body>
</html>
